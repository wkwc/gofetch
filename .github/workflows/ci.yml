name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"
  # Pinned tool versions for reproducible CI.
  STATICCHECK_VERSION: "v0.8.1"
  DEADCODE_VERSION: "v0.49.0"
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  lint-and-test:
    name: Lint, Staticcheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting (gofmt)
        run: |
          # Exclude local module caches (/.build) if present.
          unformatted=$(gofmt -s -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} && staticcheck ./...

      - name: Deadcode
        run: go install golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION} && deadcode -test=false ./...

      - name: govulncheck (vulnerability scan)
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} && govulncheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Unit tests (race, shuffled, repeat-2)
        run: go test -race -shuffle=on -count=2 ./...

      - name: CLI smoke test (black-box)
        run: ./scripts/smoke.sh

      - name: Fuzz smoke (15s)
        run: go test ./internal/fetch/ -run '^$' -fuzz '^FuzzParseContentRange$' -fuzztime 15s

  build:
    name: Build Release Binary
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: go build -ldflags="-s -w" -trimpath -o gofetch ./cmd/gofetch

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: gofetch-linux-amd64
          path: gofetch
          retention-days: 1