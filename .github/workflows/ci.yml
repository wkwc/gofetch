name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"

jobs:
  lint-and-test:
    name: Lint, Staticcheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting (gofmt)
        run: |
          # Exclude local module caches (/.build) if present.
          unformatted=$(gofmt -s -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

      - name: Unit tests
        run: go test -race -count=1 ./...

  build:
    name: Build Release Binary
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: go build -ldflags="-s -w" -trimpath -o gofetch ./cmd/gofetch

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: gofetch-linux-amd64
          path: gofetch
          retention-days: 1